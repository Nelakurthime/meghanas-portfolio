<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <radialGradient id="sphereGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="85%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <linearGradient id="silverRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="textChrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="silverGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Glowing outer ambient ring -->
  <circle cx="120" cy="120" r="105" fill="none" stroke="url(#silverRing)" stroke-width="2.5" opacity="0.4" filter="url(#silverGlow)"/>
  
  <!-- Dashed orbit ring -->
  <circle cx="120" cy="120" r="95" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6 8" opacity="0.6"/>

  <!-- Main sphere backdrop -->
  <circle cx="120" cy="120" r="82" fill="url(#sphereGrad)" stroke="url(#silverRing)" stroke-width="2"/>

  <!-- Inner ambient light -->
  <ellipse cx="105" cy="80" rx="45" ry="25" fill="#ffffff" opacity="0.08"/>

  <!-- Stylized Monogram NM -->
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="800" text-anchor="middle" fill="url(#textChrome)">
    <text x="120" y="138" font-size="52" letter-spacing="2">NM</text>
  </g>

  <!-- Small floating tech particles -->
  <circle cx="185" cy="65" r="4" fill="#38bdf8" opacity="0.9"/>
  <circle cx="58" cy="165" r="3" fill="#cbd5e1" opacity="0.8"/>
  <circle cx="180" cy="175" r="2.5" fill="#f8fafc" opacity="0.7"/>
</svg>