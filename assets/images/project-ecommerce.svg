  <rect x="336" y="246" width="46" height="28" rx="4" fill="#94a3b8" opacity="0.9"/>
  <text x="359" y="264" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">100%</text>

  <rect x="388" y="246" width="46" height="28" rx="4" fill="#94a3b8" opacity="0.6"/>
  <text x="411" y="264" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">56%</text>

